<h2 mat-dialog-title>Upload a Profile Picture</h2>
<mat-dialog-content>
  <ngx-uploadcare-widget
          images-only="true"
          public-key="2036f6a4a7e48d7a2d80"
          crop="1:1"
          (on-upload-complete)="onUploadHandler($event)">
  </ngx-uploadcare-widget>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
  <!-- <button mat-button [mat-dialog-close]="true">Okay</button> -->
</mat-dialog-actions>
